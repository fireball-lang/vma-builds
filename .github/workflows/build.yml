name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag"
        required: true

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: "windows-latest"
            target: "windows-amd64"
          - runs_on: "ubuntu-latest"
            target: "ubuntu-amd64"
          - runs_on: "macos-latest"
            target: "macos-aarch64"

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Windows MinGW Environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-vulkan-headers

      - name: Install Vulkan Headers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Install Vulkan Headers (MacOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install vulkan-headers molten-vk

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash build.sh

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "glfw-${{ env.VERSION }}-${{ matrix.target }}"
          path: "glfw/build/src/libvma.a"
